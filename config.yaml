# ============================================================================
#  Dina — Instagram content-mining config
#  Edit THIS file to make the daily ideas match *your* brand. Nothing else
#  needs changing to get started.
# ============================================================================

# --- Who you are -------------------------------------------------------------
brand:
  # Your niche in one line. Be specific.
  niche: "Training & mentorship for women in dental administration — the dental front desk, from brand-new hire to office manager"

  # 2-4 sentences on your voice/personality. This shapes tone of every idea.
  voice: >
    Warm, encouraging "big-sister energy" — a mentor's voice, not a textbook.
    Polished, calm, and beginner-safe with zero jargon-shaming. Confident and
    supportive: I make overwhelmed front-desk women feel capable and seen, never
    judged or talked down to. The structured training the dental industry forgot
    to give them.

  # Who you want in your audience AND who you eventually want to sell to.
  target_audience: >
    Women in or entering dental front-desk / admin roles: brand-new hires thrown
    in without training, career changers and returners with no dental experience,
    and strong admins ready to step into office-manager leadership. Primarily
    Canada, with some global reach.

  # What you actually sell. Ideas will be tied back to this funnel.
  offer: >
    Three self-paced Polished programs (lifetime access): the 90 Day Career Launch
    (Canadian beginner roadmap — insurance, scheduling, patient communication),
    Dental Admin x AI (practical AI workflows for the front desk), and The Polished
    Office Manager (systems for hiring, KPIs, team meetings, and leading a calm,
    profitable practice).

# --- What to mine ------------------------------------------------------------
# Accounts / creators in your niche whose content is worth reframing. Handles
# or names both work — Claude searches the web for their recent standout posts.
competitors:
  - "@ddsadministration"   # dental administration
  - "@dr.baotran"
  - "@the.sam.patel"
  - "@kirkteachout"
  - "@dr.yohanchoi"
  - "@dr.nickc"

# Hashtags / search terms that surface trending content in your space.
hashtags:
  - "#dentalfrontdesk"
  - "#dentaladmin"
  - "#dentalofficemanager"
  - "#dentalfrontoffice"
  - "#dentaladministration"
  - "#dentalpracticemanagement"

# Topics you never want suggested (off-brand, done to death, etc.). Optional.
avoid:
  - "clinical / cold / textbook tone or any jargon-shaming"
  - "clinical or chairside dentistry (this is about the ADMIN / front desk, not dentists or hygienists)"
  - "fear-bait like 'AI will replace dental admins'"

# --- Engine ------------------------------------------------------------------
model: "claude-opus-4-8"     # Anthropic model id. Leave as-is unless you know better.
num_post_ideas: 3            # How many post ideas per day.
num_reel_ideas: 3            # How many trial reel ideas per day.

# --- Output ------------------------------------------------------------------
output_dir: "reports"        # Daily markdown reports land here (dated filenames).

# --- Email delivery (optional) ----------------------------------------------
# The report is ALWAYS saved to output_dir. Email is an extra push on top and
# only fires when SMTP credentials are present in the environment (never in
# this file). Set these env vars / GitHub secrets to turn it on:
#   SMTP_HOST   e.g. smtp.gmail.com
#   SMTP_PORT   587 (STARTTLS, default) or 465 (SSL)
#   SMTP_USER   the sending account
#   SMTP_PASS   an app password (for Gmail: create one, don't use your login)
#   EMAIL_TO    where to send it   (defaults to SMTP_USER)
#   EMAIL_FROM  from address       (defaults to SMTP_USER)
email:
  subject_prefix: "📈 Polished Admin — Instagram ideas"
